[build-system]
requires = ["setuptools>=77.0.3", "pybind11>=2.10.0", "ziglang>=0.11.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forgetune"
version = "2.0.0"
description = "Specification-Driven, Correctness-Checked, Self-Optimizing Machine-Learning Compiler"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ForgeTune Authors" }
]
dependencies = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ziglang>=0.11.0",
    "pybind11>=2.10.0",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
