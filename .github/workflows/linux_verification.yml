name: ForgeTune v2.0 Linux Verification CI

on:
  push:
    branches: [ v2.0-dev, master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-linux:
    name: Linux CI Verification (Ubuntu, C++17, Python 3.12, PyTorch)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: 3. Set Up Virtual Environment & Install Pinned Dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: 4. Build Native Components from Source (-Wall -Wextra)
        run: |
          . .venv/bin/activate
          python scripts/build_native.py

      - name: 5. Run Native C++ Test Suite (13 tests)
        run: |
          ./bin/forgetune_test_suite

      - name: 6. Run Full PyTest Suite
        run: |
          . .venv/bin/activate
          python -m pytest -v tests/

      - name: 7. Execute Three-Round Master Verification Protocol
        run: |
          . .venv/bin/activate
          python scripts/v2_verify_all.py --mode=full --skip-benchmarks

      - name: 8. Verify Pure CMake Build & CTest Execution
        run: |
          . .venv/bin/activate
          cmake -B build-cmake -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake --config Release
          ctest --test-dir build-cmake --output-on-failure

  verify-python311:
    name: Python 3.11 Compatibility Verification (Ubuntu, C++17, PyTorch)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: 3. Set Up Virtual Environment & Install Pinned Dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e .

      - name: 4. Build Native Components from Source (-Wall -Wextra)
        run: |
          . .venv/bin/activate
          python scripts/build_native.py

      - name: 5. Run Native C++ Test Suite (13 tests)
        run: |
          ./bin/forgetune_test_suite

      - name: 6. Run Core Acceptance Suites
        run: |
          . .venv/bin/activate
          python -m pytest -v tests/acceptance/
