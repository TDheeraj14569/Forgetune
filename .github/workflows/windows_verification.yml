name: ForgeTune v2.0 Windows Verification CI

on:
  push:
    branches: [ v2.0-dev, master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-windows:
    name: Windows CI Verification (C++17, PyTorch, PyTest, Dynamic DLL)
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 2. Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: 3. Set Up Virtual Environment & Install Pinned Dependencies
        shell: powershell
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\pip.exe install -r requirements-ci.txt
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.venv\Scripts"
          Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_ENV=$PWD\.venv"

      - name: 4. Capture Environment & Security Diagnostics
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          Write-Host "=== OS and Kernel Information ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Write-Host "=== Python Environment ==="
          python -c "import sys; print(f'sys.executable: {sys.executable}')"
          python --version
          python -c "import torch, numpy, pybind11, ziglang, scipy; print(f'PyTorch: {torch.__version__}, NumPy: {numpy.__version__}, PyBind11: {pybind11.__version__}, SciPy: {scipy.__version__}')"
          python -c "import forgetune.native_compiler as nc; comp = nc.NativeCompiler(); print(f'Detected compiler: {comp.compiler_path} (type: {comp.compiler_type})')"
          Write-Host "=== Code Integrity / Authenticode Check ==="
          Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert
          Get-ChildItem Cert:\LocalMachine\My -CodeSigningCert
          $signTool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($null -eq $signTool) {
              Write-Host "signtool.exe not in PATH"
          } else {
              Write-Host "signtool.exe: $($signTool.Source)"
          }

      - name: 5. Build Native Components from Source (-Wall -Wextra)
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          python scripts/build_native.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 6. Verify Unsigned Dynamic DLL Loading & Parity via CI Probe
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          python scripts/ci_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 7. Run Native C++ Test Suite (13 tests)
        shell: powershell
        run: |
          Write-Host "Running bin\forgetune_test_suite.exe directly..."
          & .\bin\forgetune_test_suite.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 8. Run Full PyTest Suite
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          python -m pytest -v --tb=short --junitxml=reports/junit_report.xml tests/
          if ($LASTEXITCODE -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Pytest Failures on Windows"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            python -m pytest -v --tb=short --lf tests/ | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            exit 1
          }

      - name: 9. Run Model Acceptance, Dynamic-Batch, and Adversarial Suites
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          python -m pytest -v tests/acceptance/test_v2_models_acceptance.py tests/acceptance/test_v2_adversarial_boundary.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 10. Execute Three-Round Master Verification Protocol
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          python scripts/v2_verify_all.py --mode=full --skip-benchmarks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 11. Execute Paired Model C B=64 Statistical Benchmark (N=100)
        shell: powershell
        run: |
          $env:PYTHONPATH = "$PWD\python;$PWD"
          $env:PATH = "$PWD\.venv\Scripts;$env:PATH"
          python scripts/run_v2_paired_benchmark.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 12. Upload Test & Benchmark Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: forgetune-v2-windows-verification-artifacts
          path: |
            reports/
            bin/
            build/artifacts/
